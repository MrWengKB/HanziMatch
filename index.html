<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LVJJ4GY9FC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LVJJ4GY9FC');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音配对游戏</title>
    <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <div class="container">
        <!-- 界面一：选择字表 -->
        <div class="input-screen" id="inputScreen">
            <h1>拼音配对游戏</h1>

            <div class="lesson-picker">
                <label for="gradeSelect">年级：</label>
                <select id="gradeSelect" onchange="onGradeChange()">
                    <!-- 选项由 js/game.js 生成 -->
                </select>
            </div>
            <div class="lesson-picker">
                <label for="lessonSelect">课次：</label>
                <select id="lessonSelect" onchange="updateLessonInfo()">
                    <!-- 选项由 js/game.js 生成 -->
                </select>
            </div>
            <div class="lesson-picker" id="countPicker">
                <label for="wordCount">字数：</label>
                <select id="wordCount" onchange="updateLessonInfo()">
                    <option value="6">6 字</option>
                    <option value="10">10 字</option>
                    <option value="15">15 字</option>
                    <option value="20" selected>20 字</option>
                    <option value="30">30 字</option>
                </select>
            </div>
            <label class="mode-option">
                <input type="checkbox" id="flipMode" onchange="saveSelection()">
                <span><strong>翻翻乐</strong>：先看 3 秒，卡片翻过去后凭记忆配对</span>
            </label>
            <div class="lesson-info" id="lessonInfo"></div>
            <div class="lesson-preview" id="lessonPreview"></div>

            <!-- 自定义字表 -->
            <div id="customArea" class="hidden">
                <div class="instructions">
                    <strong>使用说明：</strong><br>
                    请输入字表,每行一个汉字和对应的拼音，用空格隔开。<br>
                    <br>
                    <strong>V2新功能：</strong><br>
                    1. <strong>同音字配对：</strong>如果"第"和"弟"都标注为dì，它们可以和任何dì配对<br>
                    2. <strong>多音字配对：</strong>一个字可以有多个读音，每个读音都需要配对<br>
                       • 例如：地 dì de（会生成两个"地"卡片，分别对应dì和de）<br>
                       • 任意"地"卡片都可以和dì或de配对<br>
                    <br>
                    例如：<br>
                    天 tiān<br>
                    地 dì de<br>
                    第 dì<br>
                    和 hé hè huó huò
                </div>
                <textarea id="wordInput" placeholder="请输入字表，每行格式：汉字 拼音1 拼音2 ...&#10;&#10;单音字示例：&#10;天 tiān&#10;人 rén&#10;&#10;多音字示例：&#10;地 dì de&#10;和 hé hè huó huò&#10;长 cháng zhǎng"></textarea>
            </div>

            <button class="btn btn-primary" id="startBtn" onclick="startGame()">生成游戏</button>
        </div>

        <!-- 界面二：游戏界面 -->
        <div class="game-screen hidden" id="gameScreen">
            <div class="game-top">
                <div class="game-lesson" id="gameLesson"></div>
                <div class="timer" id="timer">时间：00:00</div>
            </div>
            <div class="game-hint hidden" id="gameHint">💡 提示：同样的字不能重复配同样的拼音</div>
            <div class="game-board" id="gameBoard"></div>
        </div>

        <!-- 成功提示弹窗 -->
        <div class="success-modal" id="successModal">
            <div class="modal-content">
                <h2>🎉 成功过关！</h2>
                <p>用时：<span id="finalTime"></span></p>
                <div class="modal-buttons">
                    <button class="btn btn-success" onclick="replayGame()">再玩一次</button>
                    <button class="btn btn-secondary" onclick="backToMenu()">换课次</button>
                    <button class="btn btn-secondary" onclick="closeGame()">关闭</button>
                </div>
            </div>
        </div>

        <!-- 界面三：结束界面 -->
        <div class="end-screen hidden" id="endScreen">
            <h1>👋</h1>
            <h2>现在你可以关闭窗口了</h2>
        </div>
    </div>

    <script src="js/hanzilist.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
