<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拼音配对游戏 V2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        /* 隐藏类 */
        .hidden {
            display: none !important;
        }

        /* 界面一：输入界面 */
        .input-screen {
            display: block;
        }

        .instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.8;
            color: #555;
        }

        .instructions strong {
            color: #667eea;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Microsoft YaHei', monospace;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        /* 界面二：游戏界面 */
        .game-screen {
            display: block;
        }

        .timer {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            width: 100%;
        }

        .card {
            min-height: 100px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            word-break: break-all;
        }

        .card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .card.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.1);
        }

        .card.matched {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0);
            }
        }

        /* 成功提示 */
        .success-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .modal-content h2 {
            color: #28a745;
            font-size: 3em;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 1.5em;
            color: #555;
            margin-bottom: 30px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-buttons .btn {
            width: auto;
            min-width: 150px;
            margin-top: 0;
        }

        /* 界面三：结束界面 */
        .end-screen {
            display: block;
            text-align: center;
        }

        .end-screen h2 {
            color: #667eea;
            font-size: 2em;
            margin-top: 50px;
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .game-board {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }

            .card {
                font-size: 20px;
                min-height: 80px;
                padding: 15px;
            }

            .modal-content {
                padding: 30px;
            }

            .modal-content h2 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 界面一：输入界面 -->
        <div class="input-screen" id="inputScreen">
            <h1>拼音配对游戏 V2</h1>
            <div class="instructions">
                <strong>使用说明：</strong><br>
                请输入字表,每行一个汉字和对应的拼音，用空格隔开。<br>
                <br>
                <strong>V2新功能：</strong><br>
                1. <strong>同音字配对：</strong>如果"第"和"弟"都标注为dì，它们可以和任何dì配对<br>
                2. <strong>多音字配对：</strong>一个字可以有多个读音，每个读音都需要配对<br>
                   • 例如：地 dì de（会生成两个"地"卡片，分别对应dì和de）<br>
                   • 任意"地"卡片都可以和dì或de配对<br>
                <br>
                例如：<br>
                天 tiān<br>
                地 dì de<br>
                第 dì<br>
                和 hé hè huó huò
            </div>
            <textarea id="wordInput" placeholder="请输入字表，每行格式：汉字 拼音1 拼音2 ...&#10;&#10;单音字示例：&#10;天 tiān&#10;人 rén&#10;&#10;多音字示例：&#10;地 dì de&#10;和 hé hè huó huò&#10;长 cháng zhǎng"></textarea>
            <button class="btn btn-primary" onclick="startGame()">生成游戏</button>
        </div>

        <!-- 界面二：游戏界面 -->
        <div class="game-screen hidden" id="gameScreen">
            <h1>拼音配对游戏</h1>
            <div class="timer" id="timer">时间：00:00</div>
            <div class="game-board" id="gameBoard"></div>
        </div>

        <!-- 成功提示弹窗 -->
        <div class="success-modal" id="successModal">
            <div class="modal-content">
                <h2>🎉 成功过关！</h2>
                <p>用时：<span id="finalTime"></span></p>
                <div class="modal-buttons">
                    <button class="btn btn-success" onclick="replayGame()">重玩一次</button>
                    <button class="btn btn-secondary" onclick="closeGame()">关闭</button>
                </div>
            </div>
        </div>

        <!-- 界面三：结束界面 -->
        <div class="end-screen hidden" id="endScreen">
            <h1>👋</h1>
            <h2>现在你可以关闭窗口了</h2>
        </div>
    </div>

    <script>
        let words = [];
        let cards = [];
        let selectedCards = [];
        let matchedPairs = 0;
        let startTime = null;
        let timerInterval = null;

        // 音效生成器
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration, type = 'correct') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            if (type === 'correct') {
                // 正确音效：愉快的上升音调
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(frequency * 1.5, audioContext.currentTime + duration);
                oscillator.type = 'sine';
            } else {
                // 错误音效：低沉的音调
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.type = 'triangle';
            }

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function startGame() {
            const input = document.getElementById('wordInput').value.trim();
            if (!input) {
                alert('请输入字表！');
                return;
            }

            // 解析输入 - V2支持多音字
            const lines = input.split('\n').filter(line => line.trim());
            words = [];
            for (let line of lines) {
                const parts = line.trim().split(/\s+/);
                if (parts.length >= 2) {
                    const character = parts[0];
                    const pinyins = parts.slice(1); // 可能有多个拼音
                    words.push({
                        character: character,
                        pinyins: pinyins  // 存储所有拼音
                    });
                }
            }

            if (words.length === 0) {
                alert('请输入有效的字表！格式：汉字 拼音1 拼音2 ...');
                return;
            }

            // 显示游戏界面
            document.getElementById('inputScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');

            initGame();
        }

        function initGame() {
            // V2多音字功能：为每个拼音生成一对卡片
            cards = [];
            let totalPairs = 0;
            
            words.forEach((word, wordIndex) => {
                // 对于每个拼音，生成一个汉字卡片和一个拼音卡片
                word.pinyins.forEach((pinyin, pinyinIndex) => {
                    // 汉字卡片 - 存储该字的所有读音
                    cards.push({ 
                        type: 'character', 
                        value: word.character, 
                        pinyins: word.pinyins,  // 存储所有读音
                        wordIndex: wordIndex,
                        pinyinIndex: pinyinIndex
                    });
                    // 拼音卡片
                    cards.push({ 
                        type: 'pinyin', 
                        value: pinyin,
                        pinyin: pinyin,  // 当前拼音
                        wordIndex: wordIndex,
                        pinyinIndex: pinyinIndex
                    });
                    totalPairs++;
                });
            });

            // 存储总对数，用于判断游戏完成
            window.totalPairs = totalPairs;

            // 随机打散
            shuffleArray(cards);

            // 渲染游戏板
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            
            cards.forEach((card, index) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'card';
                cardElement.textContent = card.value;
                cardElement.dataset.index = index;
                cardElement.onclick = () => selectCard(index);
                gameBoard.appendChild(cardElement);
            });

            // 重置游戏状态
            selectedCards = [];
            matchedPairs = 0;
            
            startTimer();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function selectCard(index) {
            const cardElement = document.querySelectorAll('.card')[index];
            
            // 如果已经选中或已匹配，忽略
            if (cardElement.classList.contains('selected') || 
                cardElement.classList.contains('matched')) {
                return;
            }

            // 如果已经选了两张，忽略
            if (selectedCards.length >= 2) {
                return;
            }

            // 标记为选中
            cardElement.classList.add('selected');
            selectedCards.push({ index, card: cards[index] });

            // 如果选了两张卡片
            if (selectedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = selectedCards;
            
            // V2多音字配对逻辑：
            // 1. 检查是否一个是汉字卡片，一个是拼音卡片
            // 2. 汉字卡片的读音列表中包含拼音卡片的拼音即可配对
            
            let isMatch = false;
            
            if (first.card.type === 'character' && second.card.type === 'pinyin') {
                // 汉字卡片的所有读音中包含这个拼音
                isMatch = first.card.pinyins.includes(second.card.pinyin);
            } else if (first.card.type === 'pinyin' && second.card.type === 'character') {
                // 汉字卡片的所有读音中包含这个拼音
                isMatch = second.card.pinyins.includes(first.card.pinyin);
            }
            
            if (isMatch) {
                // 配对成功
                playSound(523.25, 0.2, 'correct'); // C5音
                
                setTimeout(() => {
                    const cardElements = document.querySelectorAll('.card');
                    cardElements[first.index].classList.add('matched');
                    cardElements[second.index].classList.add('matched');
                    
                    cardElements[first.index].classList.remove('selected');
                    cardElements[second.index].classList.remove('selected');
                    
                    matchedPairs++;
                    selectedCards = [];

                    // 检查是否完成 - 使用totalPairs而非words.length
                    if (matchedPairs === window.totalPairs) {
                        setTimeout(() => {
                            gameComplete();
                        }, 500);
                    }
                }, 300);
            } else {
                // 配对失败
                playSound(196.00, 0.3, 'wrong'); // G3音
                
                setTimeout(() => {
                    const cardElements = document.querySelectorAll('.card');
                    cardElements[first.index].classList.remove('selected');
                    cardElements[second.index].classList.remove('selected');
                    selectedCards = [];
                }, 800);
            }
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            const elapsed = Date.now() - startTime;
            const seconds = Math.floor(elapsed / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = 
                `时间：${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function gameComplete() {
            clearInterval(timerInterval);
            const finalTime = document.getElementById('timer').textContent.replace('时间：', '');
            document.getElementById('finalTime').textContent = finalTime;
            document.getElementById('successModal').style.display = 'flex';
        }

        function replayGame() {
            document.getElementById('successModal').style.display = 'none';
            initGame();
        }

        function closeGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('successModal').style.display = 'none';
            document.getElementById('endScreen').classList.remove('hidden');
        }
    </script>
</body>
</html>
